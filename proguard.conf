# ==============================================================================
# ProGuard Configuration for Prism IMAP Backup Tool
# ==============================================================================

# General Optimization & Shrinking Settings
-dontshrink
-dontoptimize
-dontnote
-dontwarn **
-ignorewarnings
-dontusemixedcaseclassnames
-keepattributes Exceptions,InnerClasses,Signature,Deprecated,SourceFile,LineNumberTable,*Annotation*,EnclosingMethod
-adaptresourcefilecontents **.properties,META-INF/MANIFEST.MF

# Obfuscate internal package namespace into a flat protected shield package
-repackageclasses 'com.pstconverter.shield'

# ==============================================================================
# Keep 3rd-Party Libraries Intact (Prevents runtime breaks in external SDKs)
# ==============================================================================
-keep class !com.pstconverter.** { *; }

# ==============================================================================
# Entry Points (Manifest Main-Class & CLI)
# ==============================================================================
-keep public class com.pstconverter.Launcher {
    public static void main(java.lang.String[]);
}

-keep public class com.pstconverter.App {
    public static void main(java.lang.String[]);
    public void start(javafx.stage.Stage);
}

-keep public class com.pstconverter.controller.CommandLineController {
    public static void main(java.lang.String[]);
    public static void runHeadless(java.lang.String[]);
}

# ==============================================================================
# Keep JavaFX Custom Nodes & Controllers to prevent JavaFX CSS recursion
# ==============================================================================
-keep class * extends javafx.scene.Node {
    public protected *;
}

-keep class * extends javafx.scene.control.Control {
    public protected *;
}

-keep class * extends javafx.scene.control.SkinBase {
    public protected *;
}

-keep class com.pstconverter.view.** {
    public protected *;
}

-keep class com.pstconverter.controller.** {
    public protected *;
}

# ==============================================================================
# Keep Reflection-Loaded Classes (Source Adapters & Output Handlers)
# ==============================================================================
-keep class * implements com.pstconverter.core.adapter.SourceAdapter {
    <init>();
    public *;
}

-keep class * implements com.pstconverter.core.output.OutputHandler {
    <init>(...);
    public *;
}

-keep class com.pstconverter.imap.** {
    <init>();
    public *;
}

-keep class com.pstconverter.pst.** {
    <init>();
    public *;
}

-keep class com.pstconverter.*.*SourceAdapter {
    <init>();
    public *;
}

-keep class com.pstconverter.core.output.handlers.** {
    <init>(...);
    public *;
}

# ==============================================================================
# Keep Brand Configuration Constants
# ==============================================================================
-keep class com.pstconverter.config.BrandConfig {
    public static final java.lang.String *;
    public static final int *;
    public static final boolean *;
}

# ==============================================================================
# Keep Models/Enums with public getters/setters if referenced by UI tables
# ==============================================================================
-keep class com.pstconverter.model.** {
    public *;
}

-keep class com.pstconverter.core.model.** {
    public *;
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
